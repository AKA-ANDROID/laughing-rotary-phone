name: EOD Scanner

on:
  workflow_dispatch:
  schedule:
    # 3:50 PM IST, Mon-Fri (cron is in UTC). GitHub can run this late;
    # if it does, trigger it from cron-job.org like your other bot.
    - cron: "20 10 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
